<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>背景类型</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0e0f13;
        font-family: "Hack Nerd font", "JetBrains Mono", "Consolas", "MiSans", "Noto Sans SC", 微软雅黑, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e9edf2;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .container {
        width: 100%;
        height: 100%;
        background-color: #0e0f13;
        padding: 15px 30px;
        transition:
          background 0.25s ease,
          border-color 0.2s ease;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .header {
        padding-bottom: 1.4rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .header h1 {
        font-size: 1.9rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #f0f3f8;
        line-height: 1.2;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      .option-item {
        background: rgba(20, 23, 30, 0.85);
        border-radius: 10px;
        border: 1px solid transparent;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          box-shadow 0.15s ease;
        cursor: pointer;
        user-select: none;
        backdrop-filter: blur(2px);
        position: relative;
        overflow: hidden;
      }

      .option-item:hover {
        background: rgba(30, 34, 44, 0.95);
      }

      .option-item.selected {
        background: rgba(38, 44, 58, 0.95);
      }

      .option-label {
        display: flex;
        align-items: flex-start;
        padding: 15px;
        gap: 0;
        cursor: pointer;
        width: 100%;
      }

      .option-content {
        flex: 1;
        min-width: 0;
        width: 100%;
        overflow: hidden;
      }

      .option-title {
        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #eef2f9;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .option-title .tag {
        font-size: 0.65rem;
        font-weight: 400;
        background: #222832;
        color: #b3bccd;
        padding: 0.1rem 0.55rem;
        border-radius: 100px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        border: 1px solid #303642;
      }

      .check-badge {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background-color: #22a55e;
        position: relative;
        display: none;
      }

      .option-item.selected .check-badge {
        display: block;
      }

      .check-badge::before {
        content: "";
        position: absolute;
        inset: 22%;
        background-color: #ffffff;
        clip-path: polygon(37.5% 63%, 18.5% 43.9%, 8.2% 54.2%, 37.5% 83.6%, 89.7% 31.4%, 79.4% 21.1%);
      }

      .code-block {
        display: flex;
        width: 100%;
        border-radius: 10px;
        font-family: "Google Sans Code", Consolas, "MiSans", "Noto Sans SC", 微软雅黑, sans-serif;
        font-size: 0.85rem;
        line-height: 1.55;
        color: #d6e2ff;
        border: none;
      }

      .code-block span {
        display: inline;
        text-align: left;
      }

      .code-block .prop {
        color: #9dbbff;
        text-wrap: nowrap;
      }

      .code-block .value {
        color: #c7d6ff;
      }

      .code-block .comment {
        color: #6a7a99;
        font-style: italic;
      }

      .option-item:focus-visible {
        outline: 2px solid #4f7aff;
        outline-offset: 2px;
      }

      @media (max-width: 550px) {
        .container {
          padding: 15px;
        }

        .header h1 {
          font-size: 1.5rem;
        }

        .option-label {
          padding: 15px;
        }

        .code-block {
          font-size: 0.78rem;
          padding: 0.6rem 0.8rem;
        }

        .option-title {
          font-size: 0.92rem;
          flex-wrap: wrap;
        }
      }

      input[type="radio"] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container" id="mainContainer">
      <div class="header">
        <h1 style="text-shadow: 1px 1px 2px #222">背景图像</h1>
      </div>

      <div class="options" id="optionsGroup" role="radiogroup" aria-label="背景类型选择">
        <div class="option-item selected" data-option="gradient" role="radio" aria-checked="true" tabindex="0">
          <div class="option-label">
            <div class="option-content">
              <div class="option-title">背景图像：渐变<span class="check-badge" aria-hidden="true"></span></div>
              <div class="code-block">
                <span class="prop">background-image</span>:&nbsp;<span class="value"
                  >linear-gradient(135deg, #1a6bed 0%, #ca3590 100%);</span
                >
              </div>
            </div>
          </div>
        </div>

        <div class="option-item" data-option="image" role="radio" aria-checked="false" tabindex="0">
          <div class="option-label">
            <div class="option-content">
              <div class="option-title">背景图像：图像<span class="check-badge" aria-hidden="true"></span></div>
              <div class="code-block">
                <span class="prop">background-image</span>:&nbsp;<span class="value"
                  >url('/Images/Background-Images/轮播图-10.jpg');</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const container = document.getElementById("mainContainer");
        const optionItems = document.querySelectorAll(".option-item");

        const backgroundStyles = {
          gradient: {
            backgroundColor: "transparent",
            backgroundImage: "linear-gradient(135deg, #1a6bed 0%, #ca3590 100%)",
          },
          image: {
            backgroundColor: "transparent",
            backgroundSize: "cover",
            backgroundPosition: "center",
            backgroundImage: "url('/Images/Background-Images/轮播图-10.jpg')",
          },
        };

        function selectOption(selectedElement) {
          optionItems.forEach((item) => {
            item.classList.remove("selected");
            item.setAttribute("aria-checked", "false");
          });

          selectedElement.classList.add("selected");
          selectedElement.setAttribute("aria-checked", "true");

          const optionKey = selectedElement.dataset.option;
          const style = backgroundStyles[optionKey];

          if (style) {
            container.style.backgroundColor = style.backgroundColor;
            container.style.backgroundImage = style.backgroundImage;
          }
        }

        optionItems.forEach((item) => {
          item.addEventListener("click", () => {
            selectOption(item);
          });

          item.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectOption(item);
            }
          });
        });

        const defaultOption = document.querySelector('.option-item[data-option="gradient"]');
        if (defaultOption) {
          selectOption(defaultOption);
        }
      })();
    </script>
  </body>
</html>
