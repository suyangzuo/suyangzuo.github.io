<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linux 文件操作</title>
    <link rel="icon" href="/Images/Interactive-Hub/HQ/文件操作.png" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Red+Hat+Mono:ital,wght@0,300..700;1,300..700&family=Noto+Sans+Mono&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:ital@0;1&family=Ubuntu+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/Styles/common.css" />
    <link rel="stylesheet" href="/Styles/top-banner-common.css" />
    <link rel="stylesheet" href="../control.css" />
    <link rel="stylesheet" href="../interactive-common.css" />
    <link rel="stylesheet" href="./Linux-File-Operation.css" />
    <script src="/Scripts/top-banner.js" defer></script>
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <script src="https://kit.fontawesome.com/d0483e3bd3.js" crossorigin="anonymous"></script>
    <script src="./Linux-File-Operation.js" defer></script>
  </head>
  <body>
    <!-- --------------------------- ↓ 顶部横幅 -------------------------------- -->
    <script src="../../Scripts/html-include.js" target="../../top-banner.html" position="afterbegin"></script>
    <!-- --------------------------- ↑ 顶部横幅 -------------------------------- -->

    <section class="文件操作总区 总区">
      <script src="../../Scripts/html-include.js" target="../control.html" position="afterbegin"></script>
      <p class="交互标题">Linux 文件操作</p>

      <div class="Canvas容器">
        <canvas id="canvas"></canvas>
      </div>

      <div class="设置区">
        <div class="初始化模式组">
          <span class="设置组标签">初始化模式</span>
          <label class="初始化模式标签">
            <input type="radio" name="初始化模式" value="随机" checked />
            <span class="打勾框"></span>
            <span>随机创建</span>
          </label>
          <label class="初始化模式标签">
            <input type="radio" name="初始化模式" value="仅根目录" />
            <span class="打勾框"></span>
            <span>仅根目录</span>
          </label>
          <label class="初始化模式标签">
            <input type="radio" name="初始化模式" value="模拟真实" />
            <span class="打勾框"></span>
            <span>模拟真实</span>
          </label>
        </div>
      </div>

      <div class="提示区">
        <div class="提示容器">按住 <span class="按键-空格">空格</span> 可拖拽视图</div>
        <div class="提示容器">按住 <span class="按键-Ctrl">Ctrl</span> 可单独拖拽节点</div>
      </div>

      <div class="路径显示区" id="路径显示区"></div>
      <div class="命令输入区">
        <span class="命令提示符" id="命令提示符">/</span>
        <div class="命令输入包装">
          <div class="命令高亮层" id="命令高亮层"></div>
          <input
            type="text"
            class="命令输入框"
            id="命令输入框"
            placeholder="输入命令，如: cd /、mkdir 目录名、touch 文件名…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <button class="命令执行按钮" id="命令执行按钮" title="执行">
          <i class="fa-solid fa-play"></i>
        </button>
      </div>
    </section>
  </body>
</html>
