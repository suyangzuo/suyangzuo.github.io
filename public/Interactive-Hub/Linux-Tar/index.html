<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linux 打包-压缩-解压</title>
  <link rel="icon" href="/Images/Interactive-Hub/HQ/Linux压缩解压.webp" type="image/x-icon" />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Red+Hat+Mono:ital,wght@0,300..700;1,300..700&family=Noto+Sans+Mono&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:ital@0;1&family=Ubuntu+Mono&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/Styles/common.css" />
  <link rel="stylesheet" href="/Styles/top-banner-common.css" />
  <link rel="stylesheet" href="../control.css" />
  <link rel="stylesheet" href="../interactive-common.css" />
  <link rel="stylesheet" href="./Linux-Tar.css" />
  <script src="/Scripts/top-banner.js" defer></script>
  <script src="https://cdn.lordicon.com/lordicon.js"></script>
  <script src="https://kit.fontawesome.com/d0483e3bd3.js" crossorigin="anonymous"></script>
  <script src="./Linux-Tar.js" defer></script>
</head>

<body>
  <!-- --------------------------- ↓ 顶部横幅 -------------------------------- -->
  <script src="../../Scripts/html-include.js" target="../../top-banner.html" position="afterbegin"></script>
  <!-- --------------------------- ↑ 顶部横幅 -------------------------------- -->

  <section class="Linux打包压缩解压总区 总区">
    <script src="../../Scripts/html-include.js" target="../control.html" position="afterbegin"></script>
    <p class="交互标题">Linux <span style="margin-left:1em">打包</span><span
        style="color:gray; margin:0 10px">-</span><span>压缩</span><span
        style="color:gray; margin:0 10px">-</span><span>解压</span>
    </p>

    <div class="Canvas容器">
      <canvas id="canvas"></canvas>
    </div>

    <div class="设置区">
    </div>

    <div class="提示区">
      <button class="历史记录按钮" id="历史记录按钮" title="历史记录">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>历史记录</span>
      </button>
      <div class="提示容器">按住 <img class="按键-图标" src="./Images/鼠标滚轮.png" style="scale: 1.25; filter: brightness(1.5)"
          alt="鼠标右键" /> 可拖拽视图</div>
      <div class="提示容器">按住 <img class="按键-图标" src="./Images/Ctrl.png" alt="鼠标右键" /> 可单独拖拽节点</div>
    </div>

    <div class="路径显示区" id="路径显示区"></div>
    <div class="命令输入区">
      <span class="命令提示符" id="命令提示符">/</span>
      <div class="命令输入包装">
        <div class="命令高亮层" id="命令高亮层"></div>
        <input type="text" class="命令输入框" id="命令输入框" placeholder="输入命令，如: cd /、mkdir 目录名、touch 文件名…" autocomplete="off"
          spellcheck="false" />
      </div>
      <button class="命令执行按钮" id="命令执行按钮" title="执行">
        <i class="fa-solid fa-play"></i>
      </button>
    </div>
  </section>

  <!-- 历史记录模态对话框 -->
  <div class="历史记录模态" id="历史记录模态">
    <div class="历史记录对话框">
      <div class="历史记录头部">
        <h2 class="历史记录标题">命令历史记录</h2>
        <div class="历史记录头部按钮组">
          <button class="历史记录导出按钮" id="历史记录导出按钮" title="导出为 Markdown">
            <i class="fa-solid fa-download"></i>
            <span>导出</span>
          </button>
          <button class="历史记录关闭按钮" id="历史记录关闭按钮" title="关闭">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <div class="历史记录表格容器">
        <table class="历史记录表格">
          <thead>
            <tr>
              <th>序号</th>
              <th>命令</th>
              <th>结果</th>
            </tr>
          </thead>
          <tbody id="历史记录表格体">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>

</html>
