<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>背景修剪</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0e0f13;
        font-family: "JetBrains Mono", "Consolas", "MiSans", "Noto Sans SC", 微软雅黑, sans-serif;
        height: 100vh;
        color: #e9edf2;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }

      .container {
        --边框宽度: 20px;
        --内边距宽度: 30px;
        --边框色: rgb(70, 120, 161);
        --内边距色: rgb(173, 112, 70);
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #0e0f13;
        background-image: url("/Images/Background-Images/轮播图-06.jpg");
        background-size: 150%;
        background-position: center;
        background-clip: border-box;
        border: var(--边框宽度) solid var(--边框色);
        padding: var(--内边距宽度);
        /* 给内边距区域单独着色，不受 background-clip 裁剪，方便看清内边距范围 */
        box-shadow: inset 0 0 0 var(--内边距宽度) var(--内边距色);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      /* 边框盒子：边框和内边距都透明，让背景图完整铺满包括边框区域 */
      .container[data-clip="border-box"] {
        --边框色: transparent;
        --内边距色: transparent;
      }

      /* 内边距盒子：内边距透明，边框保留，便于看出修剪停止的位置 */
      .container[data-clip="padding-box"] {
        --内边距色: transparent;
      }

      /* 文本模式：背景图只保留在文字笔画里，居中显示 */
      .clip-text {
        width: calc(100% + var(--边框宽度) * 2 + var(--内边距宽度) * 2);
        height: calc(100% + var(--边框宽度) * 2 + var(--内边距宽度) * 2);
        position: absolute;
        inset: 0;
        translate: calc(-1 * (var(--边框宽度) + var(--内边距宽度))) calc(-1 * (var(--边框宽度) + var(--内边距宽度)));
        text-wrap: nowrap;
        z-index: 2;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background-image: url("/Images/Background-Images/轮播图-06.jpg");
        background-size: cover;
        background-position: center;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        font-size: clamp(2rem, 15vw, 12rem);
        font-weight: 600;
        letter-spacing: 0.05em;
        text-align: center;
      }

      .clip-text > span {
        translate: 0 -50px;
      }

      .header {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .header h1 {
        font-size: 1.25rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #f0f3f8;
        line-height: 1.2;
        text-shadow: 2px 2px 2px #222;
      }

      .control-panel {
        position: relative;
        z-index: 1;
        background: rgba(20, 23, 30, 0.95);
        border-radius: 10px;
        padding: 15px;
        backdrop-filter: blur(2px);
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .radio-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      /* 单选框：文字即按钮，取消“方框+文本”的双元素结构以节省空间 */
      .radio-option {
        display: inline-flex;
        cursor: pointer;
        user-select: none;
        font-family: "Google Sans Code", Consolas, "MiSans", "Noto Sans SC", 微软雅黑, sans-serif;
        font-size: 0.8rem;
      }

      .radio-option input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      .radio-option span {
        color: #b3bccd;
        background: #222832;
        border: 1px solid #303642;
        border-radius: 100px;
        padding: 0.2rem 0.85rem;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .radio-option:hover span {
        background: #2a303d;
        color: #eef2f9;
      }

      .radio-option input:checked + span {
        background: rgba(79, 122, 255, 0.28);
        border-color: lightskyblue;
        color: lightcyan;
      }

      .radio-option input:focus-visible + span {
        outline: 2px solid #4f7aff;
        outline-offset: 2px;
      }

      .code-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .code-block {
        display: flex;
        border-radius: 10px;
        font-family: "Google Sans Code", Consolas, "MiSans", "Noto Sans SC", 微软雅黑, sans-serif;
        font-size: 0.85rem;
        line-height: 1.55;
        color: #d6e2ff;
        border: none;
      }

      .code-block span {
        display: inline;
        text-align: left;
      }

      .code-block .prop {
        color: #9dbbff;
        text-wrap: nowrap;
      }

      .code-block .keyword {
        color: #d2a8ff;
      }

      .code-block .semi {
        color: #ff8fa3;
      }

      @media (max-width: 550px) {
        .container {
          --内边距: 15px;
        }

        .header h1 {
          font-size: 1.5rem;
        }

        .code-block {
          font-size: 0.78rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" id="mainContainer" data-clip="border-box">
      <div class="clip-text" id="clipText" aria-hidden="true"><span>文本修剪</span></div>

      <div class="control-panel">
        <div class="header">
          <h1>背景修剪</h1>
        </div>
        <div class="code-row">
          <div class="code-block">
            <span class="prop">background-clip</span>:&nbsp;<span id="codeValue"
              ><span class="keyword">border-box</span><span class="semi">;</span></span
            >
          </div>
          <div class="radio-row" role="radiogroup" aria-label="背景修剪模式">
            <label class="radio-option">
              <input type="radio" name="clipMode" value="border-box" checked />
              <span>边框盒子</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="clipMode" value="padding-box" />
              <span>内边距盒子</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="clipMode" value="content-box" />
              <span>内容盒子</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="clipMode" value="text" />
              <span>文本</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const container = document.getElementById("mainContainer");
        const codeValue = document.getElementById("codeValue");
        const 文本层 = document.getElementById("clipText");
        const 单选框 = document.querySelectorAll('input[name="clipMode"]');

        function 更新代码(值) {
          codeValue.innerHTML = `<span class="keyword">${值}</span><span class="semi">;</span>`;
        }

        function 应用模式(值) {
          container.style.backgroundClip = 值;
          container.style.webkitBackgroundClip = 值;
          container.dataset.clip = 值;

          const 是文本 = 值 === "text";
          // 文本模式下隐藏容器自身的背景图，让中间“文字填充背景图”的效果成为唯一视觉焦点
          container.style.backgroundImage = 是文本 ? "none" : "";
          文本层.style.display = 是文本 ? "flex" : "none";

          更新代码(值);
        }

        单选框.forEach((radio) => {
          radio.addEventListener("change", () => {
            if (radio.checked) {
              应用模式(radio.value);
            }
          });
        });
      })();
    </script>
  </body>
</html>
