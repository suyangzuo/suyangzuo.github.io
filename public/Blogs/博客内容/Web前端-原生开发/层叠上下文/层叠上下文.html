        const nextDamping = Math.min(0.2, Math.max(0.01, Math.round(value * 100) / 100));
        rotationDampingInput.value = String(nextDamping);
        applyRotationDamping(nextDamping);
      }

      bindAutoRepeatButton("rotation-damping-decrease", () => setRotationDamping(controls.dampingFactor - 0.01), 100);
      bindAutoRepeatButton("rotation-damping-increase", () => setRotationDamping(controls.dampingFactor + 0.01), 100);
      rotationDampingInput.addEventListener("input", () => {
        const value = rotationDampingInput.valueAsNumber;
        if (!Number.isFinite(value) || value < 0.01 || value > 0.2) return;
        applyRotationDamping(value);
      });
      rotationDampingInput.addEventListener("change", () => {
        setRotationDamping(
          Number.isFinite(rotationDampingInput.valueAsNumber)
            ? rotationDampingInput.valueAsNumber
            : controls.dampingFactor,
        );
      });

      // --- 面板垂直拖拽 ---
      let panelDrag = null;

      function readPanelTree() {
        const tree = [];
        panel.querySelectorAll(".ctrl-row").forEach((row) => {
          if (row.classList.contains("container-row")) {
            tree.push({ row, children: [] });
            return;
          }
          const container = row.dataset.container
            ? tree.findLast((entry) => entry.row.dataset.containerId === row.dataset.container)
            : null;
          if (container) container.children.push(row);
          else tree.push({ row, children: null });
        });
        return tree;
      }

      function flattenPanelTree(tree) {
        return tree.flatMap((entry) => [entry.row, ...(entry.children || [])]);
      }

      function clonePanelTree(tree) {
        return tree.map((entry) => ({ row: entry.row, children: entry.children ? [...entry.children] : null }));
      }

      function updateEmptyContainerRows() {
        readPanelTree().forEach((entry) => {
          if (entry.children) entry.row.classList.toggle("empty", entry.children.length === 0);
        });
      }

      function captureRowRects(rows) {
        return new Map(rows.map((row) => [row, row.getBoundingClientRect()]));
      }

      function animateRowsFromRects(rows, oldRects) {
        rows.forEach((row) => {
          const oldRect = oldRects.get(row);
          if (!oldRect) return;
          const deltaY = oldRect.top - row.getBoundingClientRect().top;
          if (Math.abs(deltaY) < 0.5) return;
          row.animate([{ transform: `translateY(${deltaY}px)` }, { transform: "translateY(0)" }], {
            duration: TRANSITION_DURATION / 2,
            easing: "linear",
          });
        });
      }

      function getSourceTarget(tree, row) {
        const rootIndex = tree.findIndex((entry) => entry.row === row);
        if (rootIndex !== -1) return { type: "root", index: rootIndex };
        for (const entry of tree) {
          const childIndex = entry.children?.indexOf(row) ?? -1;
          if (childIndex !== -1) {
            return { type: "child", containerId: entry.row.dataset.containerId, index: childIndex };
          }
        }
        return { type: "root", index: tree.length };
      }

      function getContainerDropTarget(tree, clientY) {
        for (let index = 0; index < tree.length; index++) {
          const rects = flattenPanelTree([tree[index]]).map((row) => row.getBoundingClientRect());
          const top = Math.min(...rects.map((rect) => rect.top));
          const bottom = Math.max(...rects.map((rect) => rect.bottom));
          if (clientY < (top + bottom) / 2) return { type: "root", index };
        }
        return { type: "root", index: tree.length };
      }

      function getBoxDropTarget(tree, clientY) {
        for (const entry of tree) {
          if (!entry.children) continue;
          const rect = entry.row.getBoundingClientRect();
          if (clientY >= rect.top && clientY <= rect.bottom) {
            return { type: "child", containerId: entry.row.dataset.containerId, index: entry.children.length };
          }
        }

        const remainingRows = flattenPanelTree(tree);
        for (const row of remainingRows) {
          const rect = row.getBoundingClientRect();
          if (clientY >= rect.top + rect.height / 2) continue;
          if (row.classList.contains("container-row")) {
            return { type: "root", index: tree.findIndex((entry) => entry.row === row) };
          }
          if (row.dataset.container) {
            const entry = tree.find((item) => item.row.dataset.containerId === row.dataset.container);
            return {
              type: "child",
              containerId: row.dataset.container,
              index: entry.children.indexOf(row),
            };
          }
          return { type: "root", index: tree.findIndex((entry) => entry.row === row) };
        }
        return { type: "root", index: tree.length };
      }

      function getPlaceholderReference(tree, target) {
        if (target.type === "root") return tree[target.index]?.row || null;
        const containerIndex = tree.findIndex((entry) => entry.row.dataset.containerId === target.containerId);
        const container = tree[containerIndex];
        return container.children[target.index] || tree[containerIndex + 1]?.row || null;
      }

      function updatePanelDropIndicator(drag, target) {
        drag.placeholder.classList.toggle("preview", !drag.isContainer);
        drag.placeholder.classList.toggle("inside", !drag.isContainer && target.type === "child");
      }

      function movePanelPlaceholder(target) {
        const drag = panelDrag;
        const oldRects = captureRowRects(flattenPanelTree(drag.originalTree).filter((row) => !drag.rows.includes(row)));
        oldRects.forEach((_, row) => row.getAnimations().forEach((animation) => animation.cancel()));
        updatePanelDropIndicator(drag, target);
        panel.insertBefore(drag.placeholder, getPlaceholderReference(drag.tree, target));
        animateRowsFromRects([...oldRects.keys()], oldRects);
        drag.target = target;
      }

      function startPanelDrag(event, row) {
        if (event.button !== 0 || panelDrag || event.target.closest("button, input")) return;
        event.preventDefault();
        event.stopPropagation();

        const allRows = [...panel.querySelectorAll(".ctrl-row")];
        allRows.forEach((item) => item.getAnimations().forEach((animation) => animation.finish()));
        const originalTree = readPanelTree();
        const tree = clonePanelTree(originalTree);
        const isContainer = row.classList.contains("container-row");
        let draggedEntry;

        if (isContainer) {
          const rootIndex = tree.findIndex((entry) => entry.row === row);
          draggedEntry = tree.splice(rootIndex, 1)[0];
        } else {
          const rootIndex = tree.findIndex((entry) => entry.row === row);
          if (rootIndex !== -1) {
            draggedEntry = tree.splice(rootIndex, 1)[0];
          } else {
            const container = tree.find((entry) => entry.children?.includes(row));
            const childIndex = container.children.indexOf(row);
            draggedEntry = { row, children: null };
            container.children.splice(childIndex, 1);
          }
        }

        const rowsToDrag = flattenPanelTree([draggedEntry]);
        const target = getSourceTarget(originalTree, row);
        const rects = captureRowRects(rowsToDrag);
        const panelRect = panel.getBoundingClientRect();
        const placeholder = document.createElement("div");
        placeholder.className = "drag-placeholder";
        placeholder.style.height = `${rects.get(rowsToDrag.at(-1)).bottom - rects.get(rowsToDrag[0]).top}px`;
        panel.insertBefore(placeholder, rowsToDrag[0]);

        rowsToDrag.forEach((item) => {
          const rect = rects.get(item);
          item.classList.add("is-dragging");
          item.style.position = "absolute";
          item.style.left = `${rect.left - panelRect.left}px`;
          item.style.top = `${rect.top - panelRect.top}px`;
          item.style.width = `${rect.width}px`;
          item.style.height = `${rect.height}px`;
          item.style.boxSizing = "border-box";
          item.style.margin = "0";
          item.style.zIndex = "1000";
          item.style.pointerEvents = "none";
        });

        panelDrag = {
          pointerId: event.pointerId,
          row,
          rows: rowsToDrag,
          entry: draggedEntry,
          originalTree,
          tree,
          target,
          placeholder,
          startY: event.clientY,
          isContainer,
          moved: false,
        };
        updatePanelDropIndicator(panelDrag, target);
        document.body.classList.add("panel-dragging");
        row.setPointerCapture(event.pointerId);
      }

      function movePanelDrag(event) {
        const drag = panelDrag;
        if (!drag || event.pointerId !== drag.pointerId) return;
        event.preventDefault();
        const deltaY = event.clientY - drag.startY;
        drag.rows.forEach((row) => {
          row.style.transform = `translateY(${deltaY}px)`;
        });
        if (Math.abs(deltaY) < 2) return;
        drag.moved = true;
        const placeholderRect = drag.placeholder.getBoundingClientRect();
        if (event.clientY >= placeholderRect.top && event.clientY <= placeholderRect.bottom) return;

        const target = drag.isContainer
          ? getContainerDropTarget(drag.tree, event.clientY)
          : getBoxDropTarget(drag.tree, event.clientY);
        if (JSON.stringify(target) !== JSON.stringify(drag.target)) movePanelPlaceholder(target);
      }

      function finishPanelDrag(event, cancelled = false) {
        const drag = panelDrag;
        if (!drag || event.pointerId !== drag.pointerId) return;
        event.preventDefault();

        const shouldCancel = cancelled || !drag.moved;
        const finalTree = shouldCancel ? drag.originalTree : drag.tree;
        if (!shouldCancel) {
          if (drag.target.type === "root") {
            finalTree.splice(drag.target.index, 0, drag.entry);
          } else {
            const container = finalTree.find((entry) => entry.row.dataset.containerId === drag.target.containerId);
            container.children.splice(drag.target.index, 0, drag.row);
          }
        }

        const allRows = flattenPanelTree(drag.originalTree);
        const oldRects = captureRowRects(allRows);
        allRows.forEach((row) => row.getAnimations().forEach((animation) => animation.cancel()));
        drag.placeholder.remove();
        drag.rows.forEach((row) => {
          row.classList.remove("is-dragging");
          [
            "position",
            "left",
            "top",
            "width",
            "height",
            "box-sizing",
            "margin",
            "z-index",
            "pointer-events",
            "transform",
          ].forEach((property) => row.style.removeProperty(property));
        });

        finalTree.forEach((entry) => {
          if (entry.children) entry.row.classList.toggle("empty", entry.children.length === 0);
          if (!entry.row.classList.contains("container-row")) {
            delete entry.row.dataset.container;
            entry.row.classList.remove("indented");
          }
          entry.children?.forEach((row) => {
            row.dataset.container = entry.row.dataset.containerId;
            row.classList.add("indented");
          });
        });
        flattenPanelTree(finalTree).forEach((row) => panel.appendChild(row));
        animateRowsFromRects(allRows, oldRects);

        document.body.classList.remove("panel-dragging");
        try {
          drag.row.releasePointerCapture(drag.pointerId);
        } catch (_) {}
        panelDrag = null;
        if (!shouldCancel) refreshScene();
      }

      rows.forEach((row) => row.addEventListener("pointerdown", (event) => startPanelDrag(event, row)));
      panel.addEventListener("dragstart", (event) => event.preventDefault());
      window.addEventListener("pointermove", movePanelDrag, { passive: false });
      window.addEventListener("pointerup", (event) => finishPanelDrag(event));
      window.addEventListener("pointercancel", (event) => finishPanelDrag(event, true));

      // --- 初始化 ---
      updateEmptyContainerRows();
      refreshScene();

      // 粒子
      const particleCount = 400;
      const particlesGeo = new THREE.BufferGeometry();
      const particlesPos = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        particlesPos[i * 3] = (Math.random() - 0.5) * 16;
        particlesPos[i * 3 + 1] = Math.random() * 12;
        particlesPos[i * 3 + 2] = (Math.random() - 0.5) * 16;
      }
      particlesGeo.setAttribute("position", new THREE.BufferAttribute(particlesPos, 3));
      function createCircleTexture() {
        const size = 64;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.4, "rgba(255,255,255,1)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
        ctx.fill();
        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        return texture;
      }

      const particlesMat = new THREE.PointsMaterial({
        color: 0x88aaff,
        size: 0.15,
        map: createCircleTexture(),
        transparent: true,
        opacity: 0.1 + Math.random() * 0.4,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        alphaTest: 0.01,
      });
      const particles = new THREE.Points(particlesGeo, particlesMat);
      scene.add(particles);

      // --- 动画循环 ---
      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        if (isTransitioning) {
          const now = performance.now();
          const elapsed = now - transitionStartTime;
          const progress = Math.min(elapsed / TRANSITION_DURATION, 1);

          transitionData.forEach((item) => {
            const worldY = item.fromWorldY + (item.toWorldY - item.fromWorldY) * progress;
            const parent = item.group.parent;
            const parentY = parent && parent !== scene ? parent.position.y : 0;
            item.group.position.y = worldY - parentY;
          });

          // 每一帧都按当前子盒子的世界坐标重建两个包围盒，避免容器滞后或结束时跳动。
          CONTAINER_INDEXES.forEach(updateWrapperBoundsKeepChildren);

          if (progress >= 1) {
            isTransitioning = false;
            transitionData.forEach((item) => {
              item.group.userData.currentSlot = item.targetSlot;
            });
            transitionData = [];
          }
        }

        particles.rotation.y += 0.0002;
        particles.rotation.x += 0.0001;
        scene.updateMatrixWorld(true);
        camera.updateMatrixWorld();
        updateContainerLabels();
        renderer.render(scene, camera);
      }

      animate();

      // --- 窗口自适应 ---
      window.addEventListener("resize", () => {
        updateCameraViewOffset();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
