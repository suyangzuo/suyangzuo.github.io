<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c0b'/%3E%3Crect x='6' y='6' width='13' height='13' rx='2' fill='none' stroke='%23b8cf9b' stroke-width='2'/%3E%3Crect x='12' y='12' width='13' height='13' rx='2' fill='none' stroke='%23b8cf9b' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>层叠上下文实验室 · backdrop-filter 为何失效</title>
    <style>
      :root {
        /* primitives */
        --p-ink-0: oklch(0.145 0.006 100);
        --p-ink-1: oklch(0.185 0.008 110);
        --p-ink-2: oklch(0.235 0.009 110);
        --p-paper: oklch(0.955 0.014 90);
        --p-muted: oklch(0.72 0.015 100);
        --p-sage: oklch(0.79 0.105 135);
        --p-terracotta: oklch(0.72 0.12 45);
        --p-mustard: oklch(0.73 0.12 82);
        --p-blue: oklch(0.62 0.12 255);
        /* semantics */
        --bg: var(--p-ink-0);
        --surface: var(--p-ink-1);
        --surface-raised: var(--p-ink-2);
        --text: var(--p-paper);
        --text-muted: var(--p-muted);
        --line: oklch(0.34 0.012 110);
        --accent: var(--p-sage);
        --mode: var(--p-sage);
        --mode-soft: oklch(0.79 0.105 135 / 0.1);
        /* components */
        --radius: 14px;
        --font-sans: "JetBrains Mono", "Consolas", "MiSans", "Noto Sans SC", 微软雅黑, sans-serif;
        --font-mono: "JetBrains Mono", "Consolas", "MiSans", "Noto Sans SC", 微软雅黑, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        background: var(--bg);
      }
      body {
        min-height: 100dvh;
        width: 100%;
        font: 16px/1.65 var(--font-sans);
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      ::selection {
        color: var(--p-ink-0);
        background: var(--p-sage);
      }
      [hidden] {
        display: none !important;
      }
      .shell {
        width: 100%;
        margin-inline: auto;
      }
      .workbench {
        overflow: hidden;
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: oklch(0.17 0.007 110);
      }
      .mode-switch {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        width: 100%;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--p-ink-0);
      }
      .mode-option {
        position: relative;
        min-width: 0;
        cursor: pointer;
      }
      .mode-option input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .option-content {
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 8px 10px;
        border: 1px solid transparent;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 550;
        text-align: center;
        transition:
          color 0.18s ease-out,
          background-color 0.18s ease-out,
          border-color 0.18s ease-out;
      }
      .option-content::before {
        content: "";
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border: 1px solid currentColor;
        border-radius: 50%;
        translate: -4px 0;
      }
      .mode-option:hover .option-content {
        color: var(--text);
        background: oklch(0.24 0.01 110);
      }
      .mode-option input:focus-visible + .option-content {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .mode-option input:checked + .option-content {
        color: var(--text);
        border-color: rgba(199, 208, 147, 1);
        background: rgba(46, 46, 39, 1);
      }
      .mode-option input:checked + .option-content::before {
        border-color: var(--option-color);
        background: var(--option-color);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--option-color) 12%, transparent);
      }
      .mode-option.ok {
        --option-color: var(--p-sage);
      }
      .mode-option.bad {
        --option-color: var(--p-terracotta);
      }
      .mode-option .keyword {
        color: var(--option-color);
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(380px, 1fr);
      }
      .preview-panel {
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
      }
      .scene {
        position: relative;
        flex: 1;
        min-height: 300px;
        overflow: hidden;
        isolation: isolate;
        background-color: oklch(0.2 0.014 125);
        background-image:
          linear-gradient(oklch(0.95 0.014 90 / 0.06) 1px, transparent 1px),
          linear-gradient(90deg, oklch(0.95 0.014 90 / 0.06) 1px, transparent 1px);
        background-size: 32px 32px;
        touch-action: pan-y;
      }
      /* 前方元素：代码在前，先绘制，位于下层 */
      .poster {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid oklch(0.95 0.014 90 / 0.14);
        background: oklch(0.26 0.03 120);
      }
      .poster-tag,
      .panel-tag {
        position: absolute;
        left: 16px;
        top: 14px;
        z-index: 3;
        padding: 4px 9px;
        border: 1px solid oklch(0.95 0.014 90 / 0.25);
        border-radius: 999px;
        background: oklch(0.145 0.006 100 / 0.55);
        color: var(--p-paper);
        font: 12px/1.4 var(--font-mono);
        letter-spacing: 0.12em;
      }
      .panel-tag {
        position: static;
        align-self: flex-start;
      }
      .poster-word {
        position: absolute;
        left: 13%;
        top: 16%;
        color: var(--p-paper);
        font: 800 clamp(64px, 7.5vw, 118px)/0.82 var(--font-sans);
        letter-spacing: -0.06em;
        opacity: 0.9;
        transform: translate3d(calc(var(--mx, 0) * -10px), calc(var(--my, 0) * -7px), 0);
        transition: transform 0.18s ease-out;
        line-height: 1.1em;
      }
      .shape {
        position: absolute;
        will-change: transform;
        transition: transform 0.18s ease-out;
      }
      .shape-a {
        width: 25%;
        aspect-ratio: 1;
        left: -10%;
        bottom: -22%;
        border-radius: 50%;
        background: var(--p-mustard);
        transform: translate3d(calc(var(--mx, 0) * 18px), calc(var(--my, 0) * 12px), 0);
      }
      .shape-b {
        width: 22%;
        height: 86%;
        right: 9%;
        top: -18%;
        background: var(--p-terracotta);
        transform: rotate(19deg) translate3d(calc(var(--mx, 0) * 13px), calc(var(--my, 0) * 18px), 0);
      }
      .shape-c {
        width: 40%;
        aspect-ratio: 1;
        right: 10%;
        bottom: -22%;
        border: 26px solid var(--p-sage);
        border-radius: 50%;
        transform: translate3d(calc(var(--mx, 0) * -20px), calc(var(--my, 0) * -12px), 0);
      }
      .shape-d {
        width: 36%;
        height: 26%;
        left: 36%;
        bottom: 6%;
        background: repeating-linear-gradient(135deg, var(--p-blue) 0 9px, transparent 9px 18px);
        transform: translate3d(calc(var(--mx, 0) * 22px), calc(var(--my, 0) * -10px), 0);
      }
      /* 浮层容器：铺满场景，保证演示中移动 DOM 节点时视觉位置不变 */
      .panel-wrapper {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .panel-wrapper.has-filter {
        filter: drop-shadow(12px 12px 12px oklch(0.1 0.005 100 / 0.45));
      }
      /* 后方元素：代码在后，后绘制，位于上层 */
      .glass-panel {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -25% -50%;
        width: min(44%, 320px);
        min-height: 62%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 22px 22px 18px;
        border: 1px solid oklch(0.95 0.014 90 / 0.25);
        border-radius: 18px;
        background: oklch(0.18 0.008 110 / 0.42);
        -webkit-backdrop-filter: blur(16px) saturate(1.3);
        backdrop-filter: blur(16px) saturate(1.3);
        pointer-events: auto;
      }
      .glass-panel.with-box-shadow {
        box-shadow: 12px 12px 12px rgb(0 0 0 / 0.45);
      }
      .glass-panel h2 {
        margin-top: 6px;
        font-size: clamp(20px, 2vw, 27px);
        font-weight: 580;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }
      .glass-panel p {
        color: var(--text-muted);
        font-size: 13px;
      }
      .panel-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid oklch(0.95 0.014 90 / 0.16);
        color: var(--text-muted);
        font: 11px/1.5 var(--font-mono);
      }
      .status-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--mode);
        box-shadow: 0 0 0 3px var(--mode-soft);
      }
      .panel-status strong {
        color: var(--mode);
        font-weight: 500;
      }
      .inspector {
        min-width: 0;
        background: oklch(0.155 0.006 110);
      }
      .code-wrap {
        padding: 7px 0 10px;
        border-bottom: 1px solid var(--line);
      }
      .code-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        color: var(--text-muted);
        font: 10px/1 var(--font-mono);
        letter-spacing: 0.12em;
      }
      .copy-button {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 5px 7px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--text-muted);
        font: 11px/1 var(--font-sans);
        letter-spacing: 0;
        transition:
          color 0.16s ease-out,
          background-color 0.16s ease-out;
      }
      .copy-button:hover {
        color: var(--text);
        background: var(--surface-raised);
      }
      .copy-button:active {
        transform: scale(0.96);
      }
      .copy-button svg {
        width: 14px;
        height: 14px;
      }
      pre {
        overflow: auto;
        padding: 0 22px;
        color: oklch(0.84 0.018 110);
        font: 13px/1.85 var(--font-mono);
        tab-size: 2;
        scrollbar-width: thin;
        line-height: 1.25em;
      }
      .code-line {
        display: block;
        min-width: max-content;
        min-height: 1.25em;
        padding-inline: 8px;
        margin-inline: -8px;
        border-radius: 3px;
      }
      .code-line.changed {
        color: var(--mode);
        background: var(--mode-soft);
      }
      .code-comment {
        color: oklch(0.61 0.015 110);
        font-family: var(--font-sans);
      }
      .code-property {
        color: oklch(0.79 0.06 220);
      }
      .code-value {
        color: oklch(0.82 0.09 82);
      }
      .code-tag {
        color: var(--p-sage);
      }
      .code-attr {
        color: oklch(0.79 0.06 220);
      }
      .code-attr-value {
        color: oklch(0.82 0.09 82);
      }
      .toast {
        position: fixed;
        z-index: 10;
        left: 50%;
        bottom: 24px;
        min-width: 150px;
        padding: 11px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--p-paper);
        color: var(--p-ink-0);
        font-size: 13px;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 8px);
        transition:
          opacity 0.18s ease-out,
          transform 0.18s ease-out;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      body[data-mode="problem"] {
        --mode: var(--p-terracotta);
        --mode-soft: oklch(0.72 0.12 45 / 0.1);
      }
      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }
        .preview-panel {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
      @media (max-width: 640px) {
        .switch-row {
          padding: 12px;
        }
        .option-content {
          padding: 8px 6px;
          font-size: 12px;
        }
        .poster {
          left: 4%;
          width: 78%;
          height: 62%;
        }
        .glass-panel {
          right: 4%;
          top: auto;
          bottom: 5%;
          translate: 0 0;
          width: min(70%, 300px);
          min-height: 0;
        }
        .poster-word {
          font-size: 64px;
        }
        .shape-b {
          right: 2%;
        }
        .shape-c {
          right: -6%;
        }
        .card-kicker,
        .code-title,
        .copy-button {
          font-size: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
        .shape,
        .poster-word {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body data-mode="problem">
    <main class="shell">
      <section class="workbench" aria-label="backdrop-filter 与层叠上下文交互演示">
        <div class="switch-row">
          <div class="mode-switch" role="radiogroup" aria-label="选择问题复现或解决方案">
            <label class="mode-option bad">
              <input type="radio" name="solution-mode" value="problem" checked />
              <span class="option-content"><span class="keyword">问题复现</span>·失效</span>
            </label>
            <label class="mode-option ok">
              <input type="radio" name="solution-mode" value="remove" />
              <span class="option-content">方案一·<span class="keyword">移除 filter</span></span>
            </label>
            <label class="mode-option ok">
              <input type="radio" name="solution-mode" value="move-out" />
              <span class="option-content">方案二·<span class="keyword">移出容器</span></span>
            </label>
            <label class="mode-option ok">
              <input type="radio" name="solution-mode" value="move-in" />
              <span class="option-content">方案三·<span class="keyword">移入前方元素</span></span>
            </label>
          </div>
        </div>

        <div class="workspace">
          <div class="preview-panel">
            <div class="scene" id="scene">
              <!-- 前方元素：代码在前 -->
              <div class="poster" id="poster">
                <span class="poster-tag">.poster · 前方元素</span>
                <div class="poster-word" aria-hidden="true">底层<br />背景</div>
                <div class="shape shape-a" aria-hidden="true"></div>
                <div class="shape shape-b" aria-hidden="true"></div>
                <div class="shape shape-c" aria-hidden="true"></div>
                <div class="shape shape-d" aria-hidden="true"></div>
              </div>
              <!-- 浮层容器 + 后方元素：代码在后 -->
              <div class="panel-wrapper has-filter" id="panel-wrapper">
                <div class="glass-panel" id="glass-panel">
                  <span class="panel-tag">.glass-panel · 后方元素</span>
                  <h2>毛玻璃面板</h2>
                  <p>backdrop-filter: blur(16px) saturate(1.3)</p>
                  <p>代码写在后方、绘制在上层，本应模糊到它身后的前方元素。</p>
                  <div class="panel-status">
                    <span class="status-dot" aria-hidden="true"></span>
                    <strong id="status-text">失效：采样不到前方元素</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <aside class="inspector" aria-label="相关代码与原理说明">
            <div class="code-wrap">
              <div class="code-title">
                <span>HTML</span
                ><button class="copy-button" id="copy-html" type="button" aria-label="复制当前 HTML">
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <rect x="5" y="5" width="8" height="8" rx="1" stroke="currentColor" />
                    <path d="M10 3H3a1 1 0 0 0-1 1v7" stroke="currentColor" /></svg
                  >复制
                </button>
              </div>
              <pre aria-label="当前方案的 HTML 代码"><code id="html-code"></code></pre>
            </div>
            <div class="code-wrap">
              <div class="code-title">
                <span>CSS</span
                ><button class="copy-button" id="copy-css" type="button" aria-label="复制当前 CSS">
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <rect x="5" y="5" width="8" height="8" rx="1" stroke="currentColor" />
                    <path d="M10 3H3a1 1 0 0 0-1 1v7" stroke="currentColor" /></svg
                  >复制
                </button>
              </div>
              <pre aria-label="当前方案的 CSS 代码"><code id="css-code"></code></pre>
            </div>
          </aside>
        </div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite">代码已复制</div>
    <script>
      // ---------- 代码片段（纯文本，渲染时再做高亮） ----------
      function htmlLines(mode) {
        if (mode === "move-out") {
          return [
            ['<div class="stage">', 0],
            ["  <!-- 前方元素：代码在前，先绘制，位于下层 -->", 0],
            ['  <div class="poster">…</div>', 0],
            ["", 0],
            ["  <!-- 浮层容器保留 filter，供其内部其他内容使用 -->", 0],
            ['  <div class="panel-wrapper">…</div>', 0],
            ["", 0],
            ["  <!-- 后方元素移出容器，与前方元素同级 -->", 1],
            ['  <div class="glass-panel">…</div>', 1],
            ["</div>", 0],
          ];
        }
        if (mode === "move-in") {
          return [
            ['<div class="stage">', 0],
            ["  <!-- 浮层容器：filter 使其成为 Backdrop Root -->", 0],
            ['  <div class="panel-wrapper">', 0],
            ["    <!-- 前方元素移入容器，进入采样范围 -->", 1],
            ['    <div class="poster">…</div>', 1],
            ["    <!-- 后方元素：代码在后，绘制在上层 -->", 0],
            ['    <div class="glass-panel">…</div>', 0],
            ["  </div>", 0],
            ["</div>", 0],
          ];
        }
        // problem / remove 的 DOM 结构相同
        return [
          ['<div class="stage">', 0],
          ["  <!-- 前方元素：代码在前，先绘制，位于下层 -->", 0],
          ['  <div class="poster">…</div>', 0],
          ["", 0],
          ["  <!-- 浮层容器：filter 使其成为 Backdrop Root -->", mode === "problem" ? 1 : 0],
          ['  <div class="panel-wrapper">', 0],
          ["    <!-- 后方元素：代码在后，绘制在上层 -->", 0],
          ['    <div class="glass-panel">…</div>', 0],
          ["  </div>", 0],
          ["</div>", 0],
        ];
      }

      function cssLines(mode) {
        if (mode === "remove") {
          return [
            [".panel-wrapper {", 0],
            ["  /* 移除 filter，不再创建 Backdrop Root */", 1],
            ["}", 0],
            ["", 0],
            [".glass-panel {", 0],
            ["  background: rgb(26 28 26 / 0.42);", 0],
            ["  backdrop-filter: blur(16px); /* 生效 */", 1],
            ["  /* 投影改由自身承担，不连累后代 */", 1],
            ["  box-shadow: 12px 12px 12px rgb(0 0 0 / 0.45);", 1],
            ["}", 0],
          ];
        }
        const blurComment =
          mode === "problem"
            ? "/* 采样被限制在容器内：失效 */"
            : mode === "move-out"
              ? "/* 与前方元素同处一个层叠上下文：生效 */"
              : "/* 前方元素已在 Backdrop Root 边界内：生效 */";
        return [
          [".panel-wrapper {", 0],
          ["  /* 只想给浮层加投影，却创建了 Backdrop Root */", 0],
          ["  filter: drop-shadow(12px 12px 12px rgb(0 0 0 / 0.45));", mode === "problem" ? 1 : 0],
          ["}", 0],
          ["", 0],
          [".glass-panel {", 0],
          ["  background: rgb(26 28 26 / 0.42);", 0],
          [`  backdrop-filter: blur(16px); ${blurComment}`, 1],
          ["}", 0],
        ];
      }

      const STATUS = {
        problem: "失效：采样不到前方元素",
        remove: "生效：blur(16px) 可见",
        "move-out": "生效：blur(16px) 可见",
        "move-in": "生效：blur(16px) 可见",
      };

      // ---------- 轻量语法高亮 ----------
      function esc(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function hlHtmlLine(line) {
        const e = esc(line);
        if (e.includes("&lt;!--")) return `<span class="code-comment">${e}</span>`;
        return e.replace(/(&lt;\/?)([a-zA-Z][\w-]*)((?:(?!&gt;).)*?)(\/?&gt;)/g, (match, open, tag, attrs, close) => {
          const highlightedAttrs = attrs.replace(
            /([\w-]+)="([^"]*)"/g,
            '<span class="code-attr">$1</span>=<span class="code-attr-value">"$2"</span>',
          );
          return `${open}<span class="code-tag">${tag}</span>${highlightedAttrs}${close}`;
        });
      }
      function hlCssLine(line) {
        const e = esc(line);
        // 拆分行尾注释，只对注释前的代码部分做属性高亮
        const commentIndex = e.indexOf("/*");
        const code = commentIndex === -1 ? e : e.slice(0, commentIndex);
        const comment = commentIndex === -1 ? "" : e.slice(commentIndex);
        const m = code.match(/^(\s*)([a-zA-Z-]+)(\s*:\s*)(.+?)(;?)\s*$/);
        const highlightedCode = m
          ? `${m[1]}<span class="code-property">${m[2]}</span>${m[3]}<span class="code-value">${m[4]}</span>${m[5]}`
          : code;
        return highlightedCode + (comment ? ` <span class="code-comment">${comment}</span>` : "");
      }
      function renderCode(el, lines, highlighter) {
        el.innerHTML = lines
          .map(
            ([text, changed]) =>
              `<span class="code-line${changed ? " changed" : ""}">${text ? highlighter(text) : ""}</span>`,
          )
          .join("");
      }

      // ---------- 演示场景的真实 DOM / 样式切换 ----------
      const body = document.body;
      const scene = document.getElementById("scene");
      const poster = document.getElementById("poster");
      const wrapper = document.getElementById("panel-wrapper");
      const glass = document.getElementById("glass-panel");
      const statusText = document.getElementById("status-text");
      const toast = document.getElementById("toast");
      let toastTimer;

      function applyScene(mode) {
        if (mode === "move-in") {
          // 方案三：前方元素移入容器，进入 Backdrop Root 边界之内
          wrapper.hidden = false;
          wrapper.classList.add("has-filter");
          if (poster.parentElement !== wrapper) wrapper.prepend(poster);
          if (glass.parentElement !== wrapper) wrapper.appendChild(glass);
        } else if (mode === "move-out") {
          // 方案二：后方元素移出容器，与前方元素同级
          if (poster.parentElement !== scene) scene.insertBefore(poster, wrapper);
          scene.appendChild(glass);
          wrapper.hidden = true;
        } else {
          // 问题复现 / 方案一：DOM 不变，只切换容器上的 filter
          if (poster.parentElement !== scene) scene.insertBefore(poster, wrapper);
          if (glass.parentElement !== wrapper) wrapper.appendChild(glass);
          wrapper.hidden = false;
          wrapper.classList.toggle("has-filter", mode === "problem");
        }
        glass.classList.toggle("with-box-shadow", mode === "remove");
      }

      function renderMode(mode) {
        body.dataset.mode = mode;
        applyScene(mode);
        statusText.textContent = STATUS[mode];
        renderCode(document.getElementById("html-code"), htmlLines(mode), hlHtmlLine);
        renderCode(document.getElementById("css-code"), cssLines(mode), hlCssLine);
      }

      document.querySelectorAll('input[name="solution-mode"]').forEach((radio) => {
        radio.addEventListener("change", (event) => renderMode(event.target.value));
      });

      // 指针视差
      scene.addEventListener("pointermove", (event) => {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const rect = scene.getBoundingClientRect();
        scene.style.setProperty("--mx", ((event.clientX - rect.left) / rect.width - 0.5).toFixed(3));
        scene.style.setProperty("--my", ((event.clientY - rect.top) / rect.height - 0.5).toFixed(3));
      });
      scene.addEventListener("pointerleave", () => {
        scene.style.setProperty("--mx", 0);
        scene.style.setProperty("--my", 0);
      });

      // 复制当前代码
      function bindCopy(buttonId, getLines) {
        document.getElementById(buttonId).addEventListener("click", async () => {
          const mode = body.dataset.mode;
          const text = getLines(mode)
            .map(([line]) => line)
            .join("\n");
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
          }
          clearTimeout(toastTimer);
          toast.classList.add("show");
          toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
        });
      }
      bindCopy("copy-html", htmlLines);
      bindCopy("copy-css", cssLines);

      // 支持 ?mode= 直接定位到某个方案
      const initialMode = new URLSearchParams(location.search).get("mode");
      const startMode = ["problem", "remove", "move-out", "move-in"].includes(initialMode) ? initialMode : "problem";
      document.querySelector(`input[name="solution-mode"][value="${startMode}"]`).checked = true;
      renderMode(startMode);
    </script>
  </body>
</html>
